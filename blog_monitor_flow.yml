id: blog_monitor
namespace: kaiwaehner.blog

description: |
  Phase 1 of the blog monitor migration: the existing Python script runs
  unchanged inside Kestra.

  Nothing about blog_monitor.py is modified. Kestra provides the schedule,
  retries, run history, and secrets. The script keeps its own fetching,
  ranking, state handling and mail sending.

  PATHS. The script resolves every path from its own directory
  (BASE_DIR = Path(__file__).parent), so pointing work_dir somewhere else is
  enough to switch which config.json, seen_posts.json and preview.html it uses.
  During phase 2 that gave a parallel copy with its own state; in phase 3 it is
  how the flow takes over the production directory without copying anything.

  SECRETS. load_env() uses os.environ.setdefault, so environment variables
  injected here take priority over any .env file. No .env is needed.

  MODE. Defaults to send, which is what the schedule uses. dry-run still works
  for testing: it fetches, ranks, writes preview.html, and touches neither the
  state file nor the inbox. Note that a long run of dry runs freezes the state,
  so the "new posts" count climbs and the ranking response eventually gets cut
  off. That is expected, not a fault.

labels:
  owner: kai
  phase: "3-cutover"

# The script has no lock of its own: two runs writing seen_posts.json at the
# same time means last writer wins. QUEUE holds a second execution until the
# first finishes instead of letting them race.
#
# This only covers executions of THIS flow. The asset lock further down covers
# any flow that writes the state file, and it expires on its own if a run dies.
concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: mode
    type: SELECT
    defaults: send
    values:
      - dry-run
      - send
    description: |
      dry-run writes preview.html and sends no mail, leaving the state file
      untouched. Keep this during parallel validation. Switch to send only once
      the preview matches what the production cron job produced.

  - id: work_dir
    type: STRING
    defaults: /home/kaiwaehner/blog_monitor
    description: |
      Phase 3: this now points at the production directory, and the cron job
      that used to own it is commented out.

      Pointing at the same directory rather than copying state across is what
      makes the cutover exactly-once. One state file, one writer, no gap and no
      overlap. The only way to break that is to let cron and Kestra run at the
      same time, which is why cron is disabled first and the flow second.

tasks:
  # One writer at a time, across flows and workers. If another execution holds
  # the lock, Acquire fails with 423 and the retry waits for it. The TTL is the
  # safety net: a run that hangs or a worker that dies gives the file back when
  # the lease expires instead of holding it forever. 30 minutes covers the
  # 15-minute task timeout plus container start with room to spare.
  #
  # The API token needs LOCK and UNLOCK on the ASSET resource. A 403 here means
  # the token is missing that permission, not that the lock is taken.
  - id: acquire_state_lock
    type: io.kestra.plugin.kestra.ee.locks.Acquire
    assetId: blog-monitor-seen-posts
    ttl: PT30M
    auth:
      apiToken: "{{ secret('KESTRA_API_TOKEN') }}"
    retry:
      type: constant
      interval: PT1M
      maxAttempts: 20

  - id: run_monitor
    type: io.kestra.plugin.scripts.python.Commands
    description: Run the unmodified script against the production directory
    containerImage: python:3.13-slim

    # A healthy run is 3-5 minutes. The script fetches every source through a
    # ThreadPoolExecutor. Before the fix it waited on as_completed() with no
    # timeout, so a single source that opens a TCP connection and then goes
    # silent blocked the whole run. A socket timeout does not help because it
    # restarts on every byte. The fetch loop now has a 120-second total budget
    # and reports abandoned sources instead of waiting on them.
    #
    # The 15-minute timeout stays as the backstop: it means "something is
    # stuck", not "today was busy".
    timeout: PT15M

    # Declares the write for lineage and freshness. The execution holding the
    # lock may write the asset, and each write extends the lease.
    assets:
      outputs:
        - id: blog-monitor-seen-posts
          type: io.kestra.plugin.ee.assets.File
          metadata:
            system: blog-monitor
            path: "{{ inputs.work_dir }}/seen_posts.json"

    # No retry. A retry re-runs the whole script, which can cost the better part
    # of an hour, and the failure modes worth retrying (a single flaky source)
    # are already handled inside the script with three attempts and backoff.
    # A failed run simply means today's comparison is missing, and the next
    # scheduled run picks everything up because dry runs never advance state.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      volumes:
        - "{{ inputs.work_dir }}:/work"
    beforeCommands:
      # feedparser is the script's only third-party dependency. The venv on the
      # Beelink was built against the host Python and is not reused here.
      - pip install --quiet --no-cache-dir feedparser
    env:
      ANTHROPIC_API_KEY: "{{ secret('ANTHROPIC_API_KEY') }}"
      BLOG_MONITOR_PASSWORD: "{{ secret('BLOG_MONITOR_PASSWORD') }}"
      # The addresses are environment, not configuration. With these set, the
      # repository config.json (placeholder addresses) can be deployed as-is.
      BLOG_MONITOR_SENDER: "{{ secret('BLOG_MONITOR_SENDER') }}"
      BLOG_MONITOR_RECIPIENT: "{{ secret('BLOG_MONITOR_RECIPIENT') }}"
    commands:
      # No cd needed: the script derives every path from Path(__file__).parent,
      # so config, state and preview all resolve inside /work regardless of the
      # working directory. That leaves Kestra's working dir free for outputs.
      - "python -u /work/blog_monitor.py {{ inputs.mode == 'dry-run' ? '--dry-run' : '' }}"
      # Surface the preview in the UI. Optional: a send run writes none.
      # monitor.log is deliberately not captured. That file is produced by the
      # cron job's shell redirect, not by the script, so there is nothing to
      # read here. Kestra's own task log is the better record anyway.
      - "cp /work/preview.html . 2>/dev/null || true"
    outputFiles:
      - preview.html

  # WARNING, NOT FAILURE. A digest without ranking still goes out, so the run
  # stays green. The script reports ranking_ok on stdout, and a failed ranking
  # (credits used up, invalid key, retired model) opens a low-severity case
  # instead of a mail. One case per task id: repeats attach to the open case.
  - id: open_degraded_case
    type: io.kestra.plugin.kestra.ee.cases.CreateCase
    runIf: "{{ (outputs.run_monitor.vars.ranking_ok ?? true) == false }}"
    auth:
      apiToken: "{{ secret('KESTRA_API_TOKEN') }}"
    title: "Blog monitor degraded"
    severity: LOW
    linkMatchingExecutions: true
    caseDescription: |
      The run finished, but the ranking failed, so the digest had no Top News.

      Reason reported by the script: {{ outputs.run_monitor.vars.rank_note }}

      Typical causes: Anthropic credits used up, an invalid API key, or a model
      name the API no longer accepts.
    assignees:
      users:
        - "{{ secret('BLOG_MONITOR_CASE_ASSIGNEE') }}"
    sla:
      acknowledgement: P7D
      resolution: P30D

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      Blog monitor finished. mode={{ inputs.mode }}, dir={{ inputs.work_dir }}
      Preview and log are on the Outputs tab.

  # HEARTBEAT. Only a watcher outside this machine can report that the
  # machine, Kestra, or the schedule is gone: an errors block cannot fire for
  # an execution that was never created. healthchecks.io expects one ping a
  # day and mails when it is late. Only send runs ping, so dry runs and tests
  # never count as a delivered digest. allowFailure: an unreachable heartbeat
  # service must not turn a delivered digest into a failure alert.
  - id: heartbeat
    type: io.kestra.plugin.core.http.Request
    runIf: "{{ inputs.mode == 'send' }}"
    allowFailure: true
    uri: "{{ secret('HEARTBEAT_URL') }}"
    method: GET

# FAILURE ALERT. Runs when any task above fails. The case is the record, the
# mail is the push. The mail task takes its credentials straight from the
# secret store, so a broken config.json cannot silence the alert about it. It
# still shares the Gmail account with the digest; the heartbeat covers the
# case where Gmail itself is the problem.
errors:
  - id: open_failure_case
    type: io.kestra.plugin.kestra.ee.cases.CreateCase
    allowFailure: true
    auth:
      apiToken: "{{ secret('KESTRA_API_TOKEN') }}"
    title: "Blog monitor run failed"
    severity: MEDIUM
    linkMatchingExecutions: true
    caseDescription: |
      Execution {{ execution.id }} failed (mode {{ inputs.mode }}).

      If it failed before the mail went out, no digest arrived and the state
      was not saved. The next successful run then delivers everything since the
      last digest, so nothing is lost.

      Error logs:
      {% for l in errorLogs() %}
      - {{ l.taskId }}: {{ l.message }}
      {% endfor %}
    assignees:
      users:
        - "{{ secret('BLOG_MONITOR_CASE_ASSIGNEE') }}"
    sla:
      acknowledgement: P1D
      resolution: P7D

  - id: alert_mail
    type: io.kestra.plugin.email.MailSend
    from: "{{ secret('BLOG_MONITOR_SENDER') }}"
    to: "{{ secret('BLOG_MONITOR_RECIPIENT') }}"
    username: "{{ secret('BLOG_MONITOR_SENDER') }}"
    password: "{{ secret('BLOG_MONITOR_PASSWORD') }}"
    host: smtp.gmail.com
    port: 465
    transportStrategy: SMTPS
    subject: "Blog Monitor FAILED ({{ inputs.mode }}): {{ execution.id }}"
    htmlTextContent: |
      <p>The blog monitor run <b>{{ execution.id }}</b> failed in mode <b>{{ inputs.mode }}</b>.</p>
      <p>If it failed before sending, no digest went out and the state was not
      saved. The next successful run delivers everything, nothing is lost.</p>
      <p>Error logs:</p>
      <ul>
      {% for l in errorLogs() %}<li><b>{{ l.taskId }}</b>: {{ l.message }}</li>
      {% endfor %}</ul>
      <p>The execution and an open case are in Kestra.</p>

# Release runs whatever happened above: success, failure, or timeout. It is
# owner-checked and a no-op if the lock already expired, so it is safe to run
# unconditionally.
finally:
  - id: release_state_lock
    type: io.kestra.plugin.kestra.ee.locks.Release
    assetId: blog-monitor-seen-posts
    auth:
      apiToken: "{{ secret('KESTRA_API_TOKEN') }}"

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: |
      08:00, the slot the cron job used to hold. Cron is commented out rather
      than deleted, so a rollback is one crontab command.

      During the parallel phase this ran at 10:00 and was pinned to dry-run.
      08:30 had been too close: on a busy morning the cron run took 50 minutes,
      the two overlapped, and both hammered the same sources with 10 workers
      each. Worth remembering that concurrency: limit 1 does not help there. It
      only serialises executions of THIS flow; a cron job outside Kestra is
      invisible to the scheduler.
    cron: "0 8 * * *"
    timezone: Europe/Berlin
    inputs:
      mode: send
